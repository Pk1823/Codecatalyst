# Render Infrastructure as Code (Blueprint Specification)
# Docs: https://render.com/docs/blueprint-spec

services:
  # ================================================================
  # 1. Python ML Microservice (FastAPI + LightGBM + SHAP)
  # ================================================================
  - type: web
    name: missionwell-ai-engine
    runtime: python
    rootDir: ai-engine
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_ENV
        value: production

  # ================================================================
  # 2. Node.js Express REST API Backend (Prisma, SQLite/Postgres)
  # ================================================================
  - type: web
    name: missionwell-backend
    runtime: node
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: node dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./dev.db
      - key: AUTH_SECRET
        generateValue: true
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: missionwell-ai-engine
          property: host
      - key: CORS_ORIGIN
        fromService:
          type: web
          name: missionwell-frontend
          property: host

  # ================================================================
  # 3. Next.js 16 Web Frontend Portal (React 19, Tailwind CSS)
  # ================================================================
  - type: web
    name: missionwell-frontend
    runtime: node
    rootDir: frontend
    plan: free
    region: oregon
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        value: file:./dev.db
      - key: BACKEND_URL
        fromService:
          type: web
          name: missionwell-backend
          property: host
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: missionwell-backend
          property: host
