<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect width="32" height="32" rx="7.5" fill="url(#shieldGrad)"/>
  
  <!-- Subtle Top Highlight -->
  <path d="M0 7.5 C0 3.36 3.36 0 7.5 0 L24.5 0 C28.64 0 32 3.36 32 7.5 L32 15 L0 15 Z" fill="url(#glowGrad)"/>

  <!-- Military Sentinel Shield -->
  <path d="M16 4.5 L24.5 8 V15.5 C24.5 21 16 26 16 26 C16 26 7.5 21 7.5 15.5 V8 Z" 
        fill="#065f46" 
        stroke="#ffffff" 
        stroke-width="1.8" 
        stroke-linejoin="round"
        filter="url(#shadow)"/>

  <!-- Center Resilience / Wellness Heartbeat Pulse Line -->
  <path d="M10.5 15.5 H13 L14.5 11.5 L16.2 19 L17.8 13.5 L19 15.5 H21.5" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="2" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
</svg>
