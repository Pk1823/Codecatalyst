<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#062e26" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#071918" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#020a09" stop-opacity="1" />
    </radialGradient>

    <!-- Radar Sweep Gradient -->
    <linearGradient id="sweepGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.65" />
      <stop offset="50%" stop-color="#059669" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0" />
    </linearGradient>

    <!-- Biometric Wave Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="1" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.3" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      /* Radar Sweep Animation */
      @keyframes sweepRotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .radar-sweep-beam {
        transform-origin: 400px 270px;
        animation: sweepRotate 4s linear infinite;
      }

      /* Target Blip Pulsing */
      @keyframes blipPulse {
        0%, 100% { opacity: 0.2; transform: scale(0.8); }
        25% { opacity: 1; transform: scale(1.3); }
        50% { opacity: 0.4; transform: scale(1); }
      }
      .blip-1 { transform-origin: 480px 210px; animation: blipPulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite; animation-delay: 0.5s; }
      .blip-2 { transform-origin: 320px 340px; animation: blipPulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite; animation-delay: 2.3s; }
      .blip-3 { transform-origin: 490px 330px; animation: blipPulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite; animation-delay: 1.6s; }
      .blip-alert { transform-origin: 310px 190px; animation: blipPulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; animation-delay: 3.1s; }

      /* Pulse Rings for Alert */
      @keyframes ringExpand {
        0% { r: 6; opacity: 1; stroke-width: 2; }
        100% { r: 26; opacity: 0; stroke-width: 0.5; }
      }
      .pulse-ring-1 {
        animation: ringExpand 2s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
        transform-origin: 310px 190px;
      }
      .pulse-ring-2 {
        animation: ringExpand 2s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
        animation-delay: 0.6s;
        transform-origin: 310px 190px;
      }

      /* ECG / Biometric Wave Flow */
      @keyframes ecgScroll {
        0% { stroke-dashoffset: 800; }
        100% { stroke-dashoffset: 0; }
      }
      .ecg-line {
        stroke-dasharray: 800;
        animation: ecgScroll 3.5s linear infinite;
      }

      /* HUD Grid Scanline */
      @keyframes scanline {
        0% { transform: translateY(0px); opacity: 0; }
        15% { opacity: 0.8; }
        85% { opacity: 0.8; }
        100% { transform: translateY(480px); opacity: 0; }
      }
      .scanline-bar {
        animation: scanline 5s ease-in-out infinite;
      }

      /* Blink Indicator */
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.2; }
      }
      .blink-slow { animation: blink 1.4s ease-in-out infinite; }
      .blink-fast { animation: blink 0.7s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="600" rx="16" fill="url(#bgGlow)" />

  <!-- Outer HUD Frame & Tactical Grid -->
  <rect x="20" y="20" width="760" height="560" rx="12" fill="none" stroke="#059669" stroke-opacity="0.3" stroke-width="1.5" />
  <rect x="28" y="28" width="744" height="544" rx="8" fill="none" stroke="#10b981" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="6 4" />

  <!-- Tactical Corner Brackets -->
  <path d="M 20 50 L 20 20 L 50 20" fill="none" stroke="#10b981" stroke-width="3" filter="url(#softGlow)" />
  <path d="M 750 20 L 780 20 L 780 50" fill="none" stroke="#10b981" stroke-width="3" filter="url(#softGlow)" />
  <path d="M 20 550 L 20 580 L 50 580" fill="none" stroke="#10b981" stroke-width="3" filter="url(#softGlow)" />
  <path d="M 750 580 L 780 580 L 780 550" fill="none" stroke="#10b981" stroke-width="3" filter="url(#softGlow)" />

  <!-- Top Header Telemetry Bar -->
  <g id="headerBar">
    <rect x="40" y="38" width="720" height="32" rx="6" fill="#042f2e" fill-opacity="0.6" stroke="#0d9488" stroke-opacity="0.4" />
    <circle cx="58" cy="54" r="5" fill="#10b981" class="blink-slow" filter="url(#softGlow)" />
    <text x="74" y="58" fill="#34d399" font-family="monospace" font-size="12" font-weight="bold" letter-spacing="1">
      SYS://ANTI-MASKING_RADAR_V4 • LIVE SIMULATION FEED
    </text>
    <rect x="530" y="44" width="100" height="20" rx="4" fill="#065f46" />
    <text x="545" y="58" fill="#a7f3d0" font-family="monospace" font-size="10" font-weight="bold">ACTIVE TRACE</text>
    <text x="645" y="58" fill="#6ee7b7" font-family="monospace" font-size="11">LAT 34°18'N // 77°35'E</text>
  </g>

  <!-- Central Radar Scope -->
  <g id="radarScope">
    <!-- Range Rings (Concentric Circles) -->
    <circle cx="400" cy="270" r="210" fill="none" stroke="#059669" stroke-opacity="0.2" stroke-width="1" />
    <circle cx="400" cy="270" r="160" fill="none" stroke="#10b981" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="4 4" />
    <circle cx="400" cy="270" r="110" fill="none" stroke="#059669" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="400" cy="270" r="60" fill="none" stroke="#10b981" stroke-opacity="0.4" stroke-width="1" stroke-dasharray="2 4" />
    <circle cx="400" cy="270" r="15" fill="#047857" fill-opacity="0.4" stroke="#34d399" stroke-width="1.5" />
    <circle cx="400" cy="270" r="3" fill="#ecfdf5" />

    <!-- Crosshair Axes -->
    <line x1="170" y1="270" x2="630" y2="270" stroke="#10b981" stroke-opacity="0.25" stroke-width="1" />
    <line x1="400" y1="40" x2="400" y2="500" stroke="#10b981" stroke-opacity="0.25" stroke-width="1" />

    <!-- Diagonal Bearing Reference Lines -->
    <line x1="250" y1="120" x2="550" y2="420" stroke="#047857" stroke-opacity="0.15" stroke-width="0.8" stroke-dasharray="3 5" />
    <line x1="250" y1="420" x2="550" y2="120" stroke="#047857" stroke-opacity="0.15" stroke-width="0.8" stroke-dasharray="3 5" />

    <!-- Bearing Degrees -->
    <text x="395" y="55" fill="#10b981" font-family="monospace" font-size="10" opacity="0.6">000°</text>
    <text x="615" y="274" fill="#10b981" font-family="monospace" font-size="10" opacity="0.6">090°</text>
    <text x="393" y="495" fill="#10b981" font-family="monospace" font-size="10" opacity="0.6">180°</text>
    <text x="175" y="274" fill="#10b981" font-family="monospace" font-size="10" opacity="0.6">270°</text>

    <!-- Range Distance Labels -->
    <text x="406" y="215" fill="#34d399" font-family="monospace" font-size="9" opacity="0.7">5 KM</text>
    <text x="406" y="165" fill="#34d399" font-family="monospace" font-size="9" opacity="0.7">10 KM</text>
    <text x="406" y="115" fill="#34d399" font-family="monospace" font-size="9" opacity="0.7">15 KM</text>
    <text x="406" y="65" fill="#34d399" font-family="monospace" font-size="9" opacity="0.7">20 KM</text>

    <!-- Radar Sweep Beam (Rotating Wedge) -->
    <g class="radar-sweep-beam">
      <path d="M 400 270 L 400 60 A 210 210 0 0 1 581 165 Z" fill="url(#sweepGradient)" />
      <line x1="400" y1="270" x2="581" y2="165" stroke="#34d399" stroke-width="2" filter="url(#glow)" />
    </g>

    <!-- Target Blips -->
    <g class="blip-1">
      <circle cx="480" cy="210" r="4" fill="#10b981" filter="url(#glow)" />
      <circle cx="480" cy="210" r="9" fill="none" stroke="#34d399" stroke-width="1" />
      <text x="495" y="214" fill="#a7f3d0" font-family="monospace" font-size="9">UNIT-204 // OPTIMAL</text>
    </g>

    <g class="blip-2">
      <circle cx="320" cy="340" r="4" fill="#38bdf8" filter="url(#glow)" />
      <circle cx="320" cy="340" r="10" fill="none" stroke="#0284c7" stroke-width="1" />
      <text x="210" y="344" fill="#bae6fd" font-family="monospace" font-size="9">POST-KILO // REST REQ</text>
    </g>

    <g class="blip-3">
      <circle cx="490" cy="330" r="4" fill="#10b981" filter="url(#glow)" />
      <circle cx="490" cy="330" r="8" fill="none" stroke="#10b981" stroke-width="0.8" />
      <text x="504" y="334" fill="#a7f3d0" font-family="monospace" font-size="9">PATROL-09 // STABLE</text>
    </g>

    <g class="blip-alert">
      <circle cx="310" cy="190" r="5" fill="#ef4444" filter="url(#glow)" />
      <circle cx="310" cy="190" r="6" fill="none" stroke="#f87171" class="pulse-ring-1" />
      <circle cx="310" cy="190" r="6" fill="none" stroke="#ef4444" class="pulse-ring-2" />
      <rect x="155" y="172" width="140" height="34" rx="4" fill="#450a0a" fill-opacity="0.85" stroke="#ef4444" stroke-width="1" />
      <text x="162" y="186" fill="#fca5a5" font-family="monospace" font-size="9" font-weight="bold">⚠ MASKING DETECTED</text>
      <text x="162" y="198" fill="#fecaca" font-family="monospace" font-size="8">SELF: "FINE" | BIOM: 88%</text>
    </g>
  </g>

  <!-- Scanline sweep bar over radar -->
  <g class="scanline-bar" pointer-events="none">
    <line x1="30" y1="50" x2="770" y2="50" stroke="#34d399" stroke-opacity="0.25" stroke-width="2" filter="url(#glow)" />
  </g>

  <!-- Lower Panel: Real-time Biometric Pulse Wave & Telemetry -->
  <g id="biometricPanel" transform="translate(40, 480)">
    <rect x="0" y="0" width="720" height="88" rx="8" fill="#04201d" fill-opacity="0.85" stroke="#059669" stroke-opacity="0.4" stroke-width="1.2" />

    <g transform="translate(16, 18)">
      <text x="0" y="12" fill="#6ee7b7" font-family="monospace" font-size="10" font-weight="bold" letter-spacing="1">
        NEURO-FATIGUE BIOMETRIC ECG
      </text>
      <circle cx="6" cy="36" r="4" fill="#ef4444" class="blink-fast" filter="url(#softGlow)" />
      <text x="16" y="40" fill="#fca5a5" font-family="monospace" font-size="14" font-weight="bold">
        98 <tspan font-size="9" fill="#94a3b8">BPM (STRAIN)</tspan>
      </text>
      <text x="0" y="58" fill="#34d399" font-family="monospace" font-size="9">
        ANTI-MASKING DISCREPANCY: +0.76 (CRITICAL)
      </text>
    </g>

    <g transform="translate(230, 10)">
      <line x1="0" y1="20" x2="310" y2="20" stroke="#065f46" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="2 4" />
      <line x1="0" y1="45" x2="310" y2="45" stroke="#065f46" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="2 4" />
      
      <path
        d="M 0 35 L 30 35 L 40 33 L 45 42 L 52 10 L 60 55 L 68 30 L 75 37 L 85 35 
           L 120 35 L 130 33 L 135 42 L 142 8 L 150 56 L 158 28 L 165 37 L 175 35 
           L 210 35 L 220 33 L 225 42 L 232 12 L 240 54 L 248 30 L 255 37 L 265 35 L 310 35"
        fill="none"
        stroke="url(#waveGrad)"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="ecg-line"
        filter="url(#softGlow)"
      />
    </g>

    <g transform="translate(565, 14)">
      <rect x="0" y="0" width="140" height="60" rx="4" fill="#064e3b" fill-opacity="0.5" stroke="#10b981" stroke-opacity="0.3" />
      <text x="10" y="16" fill="#a7f3d0" font-family="monospace" font-size="9">FATIGUE INDEX: <tspan fill="#f87171" font-weight="bold">82/100</tspan></text>
      <text x="10" y="32" fill="#a7f3d0" font-family="monospace" font-size="9">SLEEP DEFICIT: <tspan fill="#fbbf24" font-weight="bold">-4.5 HRS</tspan></text>
      <text x="10" y="48" fill="#a7f3d0" font-family="monospace" font-size="9">STAND-DOWN: <tspan fill="#34d399" font-weight="bold">REQUIRED</tspan></text>
    </g>
  </g>
</svg>
